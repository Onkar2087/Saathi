# Render Blueprint — one web service runs the Next.js PWA and the Mastra agent together.
services:
  - type: web
    name: saathi
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    # Deploys are triggered by GitHub Actions after lint/typecheck/build pass (see .github/workflows/ci.yml).
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Gemma 4 on DigitalOcean Serverless Inference (OpenAI-compatible)
      - key: MODEL_BASE_URL
        value: https://inference.do-ai.run/v1
      - key: MODEL_API_KEY # DigitalOcean Model Access Key, scoped to Gemma 4 only
        sync: false
      - key: MODEL_NAME
        value: gemma-4-31B-it
      - key: MODEL_SUPPORTS_TOOLS # Gemma 4 does tool calling: enables Mastra tools + working memory
        value: "true"
      - key: EMBED_MODEL_NAME # no serverless embedding model: help notes use keyword search
        value: none
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: saathi
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: SENTRY_DSN
        sync: false
