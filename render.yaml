services:
  - type: web
    name: saathi
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: MODEL_BASE_URL
        value: https://inference.do-ai.run/v1
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_NAME
        value: gemma-4-31B-it
      - key: MODEL_SUPPORTS_TOOLS
        value: "true"
      - key: EMBED_MODEL_NAME
        value: none
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: saathi
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: SENTRY_DSN
        sync: false
