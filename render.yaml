# Render Blueprint — one web service runs the Next.js PWA and the Mastra agent together.
services:
  - type: web
    name: saathi
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    # Deploys are triggered by GitHub Actions after lint/typecheck/build pass (see .github/workflows/ci.yml).
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: MODEL_BASE_URL # your DigitalOcean Droplet, e.g. https://gemma.example.com/v1
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_NAME
        value: gemma3:4b
      - key: EMBED_MODEL_NAME
        value: embeddinggemma
      - key: MODEL_SUPPORTS_TOOLS
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: saathi
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: SENTRY_DSN
        sync: false
